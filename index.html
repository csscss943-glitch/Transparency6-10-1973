:"ما علاقة تكنولوجيا المعلومات بالذكاء الاصطناعي؟",a:"تكنولوجيا المعلومات توفر البيانات والبنية التحتية التي يتعلم منها الذكاء الاصطناعي.",tag:"ربط"},{id:16,q:"اذكر مثال على تحول رقمي في التعليم؟",a:"منصات التعلم عن بعد والفصول الافتراضية.",tag:"مثال"},{id:17,q:"اذكر مثال في الصحة؟",a:"السجلات الصحية الإلكترونية والاستشارات عن بعد.",tag:"مثال"},{id:18,q:"لماذا نحتاج محو أمية رقمية؟",a:"لتمكين الأفراد من استخدام التقنيات بأمان ومسؤولية وتقليل الفجوة الرقمية.",tag:"تحليل"},{id:19,q:"ما هو المجتمع المعلوماتي؟",a:"مجتمع يعتمد بشكل كبير على المعلومات والتقنيات الرقمية في أنشطته.",tag:"أساسي"},{id:20,q:"ما خلاصة الدرس؟",a:"تكنولوجيا المعلومات أداة قوية للتحول الرقمي بفرص وتحديات تتطلب استخداما مسؤولا ووعي بالخصوصية والفجوة.",tag:"خلاصة"}]},{id:"1-2",shortTitle:"1-2",title:"الدرس 1-2: كيف يعمل الذكاء الاصطناعي",essays:[{id:1,q:"ما هو الذكاء الاصطناعي؟",a:"قدرة الأنظمة الحاسوبية على محاكاة قدرات بشرية مثل التعلم والاستدلال وحل المشكلات.",tag:"أساسي"},{id:2,q:"ما هو التعلم الآلي ML؟",a:"فرع من الذكاء يتعلم الأنماط من بيانات التدريب لإجراء تنبؤات دون برمجة صريحة لكل حالة.",tag:"أساسي"},{id:3,q:"ما هو التعلم العميق DL؟",a:"فرع من ML يستخدم شبكات عصبية عميقة متعددة الطبقات لتعلم الأنماط المعقدة.",tag:"أساسي"},{id:4,q:"ما هو الذكاء التوليدي GenAI؟",a:"نوع من DL يولد محتوى جديد (نص، صورة، كود) بناء على ما تعلمه.",tag:"أساسي"},{id:5,q:"ما علاقة AI و ML و DL و GenAI؟",a:"AI مظلة عامة > ML فرع منه > DL فرع من ML > GenAI فرع من DL.",tag:"ربط"},{id:6,q:"ما هي بيانات التدريب؟",a:"الأمثلة التي يتعلم منها النظام أنماطه قبل استخدامه.",tag:"أساسي"},{id:7,q:"كيف يتعلم النموذج؟",a:"بتحليل بيانات التدريب واستخراج الأنماط والعلاقات لاستخدامها في التنبؤ.",tag:"تحليل"},{id:8,q:"ما هي الشبكة العصبية؟",a:"نموذج مستوحى من الدماغ مكون من طبقات من العقد المترابطة تتعلم الأنماط.",tag:"أساسي"},{id:9,q:"ما هي الهلوسة؟",a:"توليد معلومات غير صحيحة أو غير مدعومة تبدو مقنعة.",tag:"أساسي"},{id:10,q:"لماذا تحدث الهلوسة؟",a:"عندما يولد النموذج إجابة لا تستند لبيانات حقيقية أو عندما تكون بيانات التدريب غير كافية.",tag:"تحليل"},{id:11,q:"ما هي مشكلة الصندوق الأسود؟",a:"عدم وضوح كيف توصل الذكاء لقراره فيصعب تفسيره واكتشاف أخطائه.",tag:"أساسي"},{id:12,q:"ما الفرق بين القواعد المبرمجة والتعلم من البيانات؟",a:"المبرمجة: يكتب الإنسان القواعد صراحة - التعلم: يتعلم النظام القواعد من البيانات.",tag:"مقارنة"},{id:13,q:"ما هو النموذج؟",a:"النظام الذي تم تدريبه على البيانات وأصبح قادرا على التنبؤ أو التوليد.",tag:"أساسي"},{id:14,q:"كيف نقيم أداء النموذج؟",a:"باختباره على بيانات جديدة لم يرها أثناء التدريب وقياس دقته.",tag:"تحليل"},{id:15,q:"ما هو التحيز في بيانات التدريب؟",a:"عندما تكون البيانات غير ممثلة للواقع أو متحيزة لفئة معينة.",tag:"أساسي"},{id:16,q:"ما أثر التحيز؟",a:"يؤدي لنتائج غير عادلة أو غير دقيقة.",tag:"تحليل"},{id:17,q:"كيف نقلل الهلوسة؟",a:"التحقق من المصادر، مقارنة مع مصادر موثوقة، استخدام بيانات تدريب جيدة، إشراف بشري.",tag:"تطبيق"},{id:18,q:"هل الذكاء يفهم مثل الإنسان؟",a:"لا، هو يتعرف على الأنماط إحصائيا ولا يفهم المعنى مثل الإنسان.",tag:"مقارنة"},{id:19,q:"اذكر مثال على ML ومثال على GenAI؟",a:"ML: نظام يتنبأ بأسعار المنازل - GenAI: نموذج يولد نص أو صورة.",tag:"مثال"},{id:20,q:"ما خلاصة الدرس؟",a:"AI يتدرج من ML إلى DL إلى GenAI، يتعلم من بيانات التدريب لكنه قد يهلوس ويكون صندوق أسود لذلك يحتاج تحقق.",tag:"خلاصة"}]},{id:"1-3",shortTitle:"1-3",title:"الدرس 1-3: الذكاء في الحياة اليومية والصناعة",essays:[{id:1,q:"ما هو نظام التوصية؟",a:"نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات - يوتيوب، أمازون، سبوتيفاي.",tag:"أساسي"},{id:2,q:"ما هو المساعد الصوتي؟",a:"تقنية تتعرف على الصوت وتفهم الأوامر وتنفذها - سيري، مساعد جوجل.",tag:"أساسي"},{id:3,q:"ما هي الترجمة الآلية؟",a:"ترجمة النص تلقائيا إلى لغات مختلفة - Google Translate و DeepL.",tag:"أساسي"},{id:4,q:"ما هو التعرف على الوجه؟",a:"الكشف عن وجوه الأشخاص في الصور والتعرف عليها تلقائيا - فتح الهاتف.",tag:"أساسي"},{id:5,q:"كيف يستخدم في الرعاية الصحية؟",a:"التشخيص بالصور (كشف الأمراض من الأشعة) ودعم اكتشاف الأدوية.",tag:"تطبيق"},{id:6,q:"كيف يستخدم في الزراعة؟",a:"التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض.",tag:"تطبيق"},{id:7,q:"كيف يستخدم في التصنيع؟",a:"أتمتة فحص جودة المنتج والصيانة التنبؤية.",tag:"تطبيق"},{id:8,q:"كيف يستخدم في الخدمات اللوجستية؟",a:"تحسين مسارات التوصيل.",tag:"تطبيق"},{id:9,q:"ما الذي يبرع فيه AI؟",a:"إيجاد وتصنيف الأنماط في البيانات المعقدة، التعرف على الصور والصوت والنص وتوليد بعض المحتوى، الاستدلال الاحتمالي والتنبؤ.",tag:"تحليل"},{id:10,q:"ما الذي يتطلب الحذر؟",a:"الأحكام الأخلاقية التي قد تؤدي لتمييز، المعلومات الشخصية والخصوصية، القرارات عالية الأثر والمسؤولية.",tag:"تحليل"},{id:11,q:"لماذا التشخيص بالصور يحتاج طبيب بشري؟",a:"لأنه قرار عالي الأثر يخص حياة الأشخاص ويحتاج حكم بشري وتحقق من المخرجات.",tag:"تحليل"},{id:12,q:"ما مخاطر استخدام بيانات السلوك؟",a:"يثير مخاوف خصوصية لأن خدمات الذكاء تستخدم ما تشاهده وتشتريه وتقوله.",tag:"تحليل"},{id:13,q:"ما الفرق بين استخدام يومي وصناعي؟",a:"اليومي: توصية وصوتي وترجمة ووجه - الصناعي: تشخيص واكتشاف أدوية وحصاد وآفات وجودة وصيانة ومسارات.",tag:"مقارنة"},{id:14,q:"اذكر ميزة وتحدي لاستخدام AI في الزراعة؟",a:"ميزة: تنبؤ دقيق بالحصاد وكشف مبكر للآفات - تحدي: بيانات غير كافية أو تحيز أو خصوصية بيانات المزارعين.",tag:"تطبيق"},{id:15,q:"كيف يعمل نظام التوصية في مكتبة مدرسية؟",a:"يحلل ما استعاره الطلاب سابقا (بيانات سلوك) ويتنبأ بما قد يهمهم ويعرض توصيات.",tag:"تطبيق"},{id:16,q:"ما احتياط يجب أن تراعيه المدرسة في التوصية؟",a:"حماية خصوصية بيانات الاستعارة وعدم استخدامها لغير الغرض الأصلي.",tag:"تطبيق"},{id:17,q:"ما هي الصيانة التنبؤية؟",a:"استخدام البيانات للتنبؤ بأعطال الآلات قبل وقوعها.",tag:"أساسي"},{id:18,q:"ما هو الذكاء للتشخيص بالصور؟",a:"نظام يحلل صور الأشعة والمقطعية للكشف عن الأمراض.",tag:"أساسي"},{id:19,q:"هل توصية فيديو بنفس أهمية خطأ تشخيص طبي؟",a:"لا، التشخيص أهم لأن أثر الخطأ عالي ويمس حياة ومسؤولية.",tag:"مقارنة"},{id:20,q:"ما خلاصة الدرس؟",a:"AI بارع في إيجاد الأنماط والتصنيف والتوصيات والصوت والترجمة والوجه ومهام الصناعة لكن الحكم البشري ضروري للأخلاق والخصوصية والمسؤولية.",tag:"خلاصة"}]},{id:"1-4",shortTitle:"1-4",title:"الدرس 1-4: القضايا الأخلاقية",essays:[{id:1,q:"ما هو التحيز الخوارزمي؟",a:"نمط في مخرجات AI قد يؤدي لنتائج غير عادلة أو ضارة ينشأ من البيانات أو تصميم النظام أو طريقة استخدامه أو السياق البشري والاجتماعي.",tag:"أساسي"},{id:2,q:"ما هي بيانات التدريب؟",a:"الأمثلة التي يتعلم منها النظام أنماطه، كلما قل تمثيلها للواقع زاد احتمال تحيز مخرجاته.",tag:"أساسي"},{id:3,q:"اذكر 3 أسباب للتحيز؟",a:"بيانات تدريب متحيزة، انعكاس نزعات تمييزية سابقة، بيانات غير كافية عن سمات معينة.",tag:"تعداد"},{id:4,q:"ما مثال على تحيز؟",a:"نظام توظيف يفضل فئة معينة، أو نظام تعرف على وجه أكثر عرضة لإساءة التعرف على مجموعات عرقية معينة.",tag:"مثال"},{id:5,q:"ما هي قضايا الخصوصية؟",a:"المراقبة عبر التعرف على الوجه وتتبع الأفراد في الأماكن العامة، والجمع الجماعي لبيانات السلوك وتحليلها بكميات كبيرة.",tag:"تحليل"},{id:6,q:"ما هو XAI؟",a:"الذكاء القابل للتفسير: تقنية تتيح للبشر فهم سبب اتخاذ الذكاء حكما معينا، أساليب تساعد على فهم العوامل المؤثرة في المخرج، اختصاره XAI.",tag:"أساسي"},{id:7,q:"ما هي مشكلة الصندوق الأسود؟",a:"عندما يكون غير واضح كيف توصل الذكاء لحكمه فيصعب تقييمه واكتشاف الأخطاء أو التحيز.",tag:"أساسي"},{id:8,q:"ما هي المسؤولية؟",a:"تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه مثل المطور والجهة المشغلة والمستخدم، لا يوجد توزيع واحد يصلح لكل السياقات.",tag:"أساسي"},{id:9,q:"ما هي المساءلة؟",a:"تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها.",tag:"أساسي"},{id:10,q:"ما هي الشفافية؟",a:"إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده.",tag:"أساسي"},{id:11,q:"ما هي العدالة؟",a:"عدم التمييز ظلما ضد أي شخص أو مجموعة بعينها.",tag:"أساسي"},{id:12,q:"ما هي حماية الخصوصية؟",a:"التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها.",tag:"أساسي"},{id:13,q:"ما الفرق بين XAI والشفافية؟",a:"XAI: أساليب لفهم العوامل التي أسهمت في مخرج - الشفافية: إتاحة معلومات واضحة عن النظام وحدوده واستخدامه.",tag:"مقارنة"},{id:14,q:"هل المساءلة هي نفسها شرح القرار؟",a:"لا، الشرح وظيفة XAI، المساءلة تحديد من يحاسب على النتيجة.",tag:"مقارنة"},{id:15,q:"كيف يقلل العدالة والشفافية التحيز؟ [6 درجات]",a:"عدالة: فحص تمثيل البيانات واختبار النتائج عبر فئات مختلفة - شفافية: إظهار عملية اتخاذ القرار وحدوده ومراجعة التصميم والسياق.",tag:"تطبيق"},{id:16,q:"لماذا لا يوجد توزيع واحد للمسؤولية؟",a:"لأنه يختلف باختلاف النظام والاستخدام والقواعد المعمول بها وأدوار المطور والمشغل والمستخدم.",tag:"تحليل"},{id:17,q:"طبق: مدرسة تريد كاميرات تعرف وجه للحضور - فائدة وقلق ومسؤول؟",a:"فائدة: تسجيل حضور تلقائي - قلق: خصوصية وتتبع - مسؤول: المدرسة كمستخدم والشركة كمطور، يحتاج موافقة أولياء الأمور.",tag:"تطبيق"},{id:18,q:"إذا لم يستطع أحد شرح سبب رفض طلب توظيف - ما المبدأ المفقود؟",a:"الشفافية و XAI والعدالة - غير عادل لأنه لا يمكن التحقق.",tag:"تطبيق"},{id:19,q:"اقترح قاعدة لاستخدام AI في التوظيف بأمان؟",a:"فحص تمثيل البيانات، اختبار عبر فئات، مراجعة التصميم والسياق، شفافية، عدالة، تحديد المسؤول.",tag:"تطبيق"},{id:20,q:"ما خلاصة الدرس؟",a:"إذا كانت بيانات التدريب متحيزة يمكن للذكاء أن يكرر التحيز؛ واستخدام مسؤول يعني التحقق من التحيز والقدرة على شرح القرارات ومعرفة المسؤول مسترشدا بالعدالة والشفافية وحماية الخصوصية والمساءلة.",tag:"خلاصة"}]}];function ni(e){let n=[...e];for(let t=n.length-1;t>0;t--){let r=Math.floor(Math.random()*(t+1));[n[t],n[r]]=[n[r],n[t]]}return n}function C0(e){let n={"1-1":["برنامج لتشغيل الألعاب فقط","جهاز لطباعة المستندات فقط","مجموعة صور غير معالجة","نظام تشغيل للحاسوب","شبكة اجتماعية للتواصل فقط","خدمة بريدية تقليدية","قاعدة بيانات للأسماء فقط"],"1-2":["نظام يعمل بقواعد مبرمجة فقط دون تعلم","برنامج لكتابة النصوص فقط","جهاز لقياس الحرارة","لغة برمجة قديمة","قاعدة بيانات ثابتة لا تتغير","نظام يفهم المشاعر كالإنسان تماما","خوارزمية ترتيب أرقام فقط"],"1-3":["نظام يوصي بكتب بناء على لون الغلاف فقط","مساعد لا يفهم الصوت أبدا","ترجمة يدوية من قاموس ورقي","نظام يتعرف على السيارات فقط","تشخيص يعتمد على التخمين دون صور","زراعة تعتمد على العشوائية فقط","توصيل يختار أطول مسار دائما"],"1-4":["نظام عادل دائما دون أي تحيز","بيانات تدريب تمثل الواقع 100% دائما","شفافية تعني إخفاء كل المعلومات","مسؤولية تقع على المستخدم فقط دائما","خصوصية تعني مشاركة كل البيانات","عدالة تعني معاملة مخت
